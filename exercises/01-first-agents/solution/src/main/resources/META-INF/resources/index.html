<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Management System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <h1>Incident Management System</h1>

    <!-- Notification and Error Messages -->
    <div id="notification" style="display: none; background-color: #4CAF50; color: white; padding: 10px; margin-bottom: 10px; border-radius: 5px;"></div>
    <div id="error-message" style="display: none; background-color: #f44336; color: white; padding: 10px; margin-bottom: 10px; border-radius: 5px;"></div>

    <!-- Refresh Button -->
    <button id="refresh-button" style="margin-bottom: 20px; padding: 10px; background-color: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Refresh Data
    </button>

    <!-- Section 1: Incident Dashboard -->
    <div id="incident-dashboard-section" class="section">
        <h2>Incident Dashboard</h2>

        <!-- Filter input -->
        <div class="filter-container">
            <input type="text" id="incident-filter" placeholder="Filter incidents..." class="filter-input">
            <select id="filter-field" class="filter-select">
                <option value="all">All Fields</option>
                <option value="id">Incident #</option>
                <option value="system">System</option>
                <option value="service">Service</option>
                <option value="priority">Priority</option>
                <option value="description">Description</option>
                <option value="status">Status</option>
            </select>
            <button id="clear-filter" class="filter-button">Clear</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th class="sortable" data-sort="id">Incident # <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-sort="system">System <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-sort="service">Service <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-sort="priority">Priority <span class="sort-icon">↕</span></th>
                    <th>Description</th>
                    <th class="sortable" data-sort="status">Status <span class="sort-icon">↕</span></th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="incident-table-body">
                <!-- Table rows will be populated by JavaScript -->
                <tr>
                    <td colspan="7">Loading data...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
