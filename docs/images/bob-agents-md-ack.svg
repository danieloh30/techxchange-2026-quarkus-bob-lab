<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="680" height="420" fill="#f8fafc" rx="8"/>

  <!-- Chat window frame -->
  <rect x="12" y="12" width="656" height="396" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Window title bar -->
  <rect x="12" y="12" width="656" height="40" rx="8" fill="#1e1e2e"/>
  <rect x="12" y="38" width="656" height="14" fill="#1e1e2e"/>
  <circle cx="36" cy="32" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="32" r="6" fill="#ffbd2e"/>
  <circle cx="76" cy="32" r="6" fill="#28c940"/>
  <text x="300" y="37" fill="#9ca3af" font-size="12" text-anchor="middle">IBM Bob — lab/</text>

  <!-- User message -->
  <rect x="360" y="68" width="290" height="78" rx="8" fill="#3b82f6"/>
  <text x="376" y="86" fill="#bfdbfe" font-size="10" font-weight="600">You (Jordan)</text>
  <text x="376" y="102" fill="#ffffff" font-size="11">Read lab/AGENTS.md before answering</text>
  <text x="376" y="117" fill="#ffffff" font-size="11">anything about this project. Do not scan</text>
  <text x="376" y="132" fill="#ffffff" font-size="11">Java files — all context is in AGENTS.md.</text>

  <!-- Bob response bubble -->
  <rect x="28" y="162" width="460" height="188" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="44" y="183" fill="#15803d" font-size="11" font-weight="700">IBM Bob</text>
  <text x="44" y="200" fill="#166534" font-size="11">✓ Read lab/AGENTS.md (163 tokens).</text>
  <text x="44" y="220" fill="#374151" font-size="11" font-weight="600">Project understood:</text>
  <text x="44" y="237" fill="#374151" font-size="11">  • Runtime: IBM Quarkus 3.37.4 / Java 25 / quarkus-langchain4j 1.12.0</text>
  <text x="44" y="253" fill="#374151" font-size="11">  • 7 agents: TriageAgent, DiagnosticAgent, IncidentAnalysisAgent,</text>
  <text x="64" y="269" fill="#374151" font-size="11">ImpactAgent, EscalationAgent, ResolutionAgent, IncidentSupervisorAgent</text>
  <text x="44" y="285" fill="#374151" font-size="11">  • 2 workflows: IncidentAnalysisWorkflow (@ParallelMapperAgent),</text>
  <text x="64" y="301" fill="#374151" font-size="11">IncidentProcessingWorkflow (@SequenceAgent)</text>
  <text x="44" y="320" fill="#15803d" font-size="11" font-weight="600">10 project rules active. What do you want to build?</text>
  <text x="44" y="337" fill="#6b7280" font-size="10">No Java file scan performed.</text>

  <!-- Token counter strip -->
  <rect x="28" y="362" width="460" height="32" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="44" y="383" fill="#065f46" font-size="11" font-weight="600">⚡ Tokens this turn: 163</text>
  <text x="200" y="383" fill="#6b7280" font-size="11">  vs ~800 for a 20-file scan  →  637 saved</text>

  <!-- Annotation arrow: "No file scan!" -->
  <line x1="500" y1="240" x2="540" y2="200" stroke="#f59e0b" stroke-width="2"/>
  <rect x="536" y="172" width="124" height="36" rx="5" fill="#fef3c7" stroke="#fde047" stroke-width="1"/>
  <text x="550" y="188" fill="#78350f" font-size="11" font-weight="600">No file scan!</text>
  <text x="550" y="202" fill="#92400e" font-size="10">163 tokens only</text>
</svg>
