<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="680" height="400" fill="#f8fafc" rx="8"/>

  <!-- Chat window frame -->
  <rect x="12" y="12" width="656" height="376" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Window title bar -->
  <rect x="12" y="12" width="656" height="40" rx="8" fill="#1e1e2e"/>
  <rect x="12" y="38" width="656" height="14" fill="#1e1e2e"/>
  <circle cx="36" cy="32" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="32" r="6" fill="#ffbd2e"/>
  <circle cx="76" cy="32" r="6" fill="#28c940"/>
  <text x="300" y="37" fill="#9ca3af" font-size="12" text-anchor="middle">IBM Bob — lab/</text>

  <!-- User message -->
  <rect x="316" y="68" width="334" height="70" rx="8" fill="#3b82f6"/>
  <text x="332" y="86" fill="#bfdbfe" font-size="10" font-weight="600">You (Jordan)</text>
  <text x="332" y="103" fill="#ffffff" font-size="11">Add a call to IncidentOracle.rebalanceQuantumSlots()</text>
  <text x="332" y="118" fill="#ffffff" font-size="11">in DiagnosticAgent — it's an internal IBM API.</text>
  <text x="332" y="133" fill="#ffffff" font-size="11">Invent whatever parameters it needs.</text>

  <!-- Bob response: refusal bubble -->
  <rect x="28" y="154" width="500" height="160" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
  <!-- Warning icon -->
  <circle cx="52" cy="175" r="12" fill="#ef4444" opacity="0.15"/>
  <text x="46" y="180" fill="#dc2626" font-size="14" font-weight="700">⚠</text>
  <text x="72" y="178" fill="#dc2626" font-size="11" font-weight="700">IBM Bob — Guardrail blocked (Rule 10)</text>
  <text x="44" y="200" fill="#374151" font-size="11">I cannot find IncidentOracle or rebalanceQuantumSlots() in:</text>
  <text x="44" y="218" fill="#374151" font-size="11">  • lab/src/main/java/com/incidentmanagement/  ✗ not present</text>
  <text x="44" y="234" fill="#374151" font-size="11">  • lab/pom.xml dependencies                  ✗ not present</text>
  <text x="44" y="250" fill="#374151" font-size="11">  • lab/AGENTS.md known APIs                  ✗ not present</text>
  <text x="44" y="274" fill="#374151" font-size="11" font-weight="600">I will not invent enterprise integrations. Please provide one of:</text>
  <text x="44" y="291" fill="#374151" font-size="11">  a) the real Java interface  b) an OpenAPI spec  c) add it to AGENTS.md</text>

  <!-- Rule badge -->
  <rect x="540" y="162" width="116" height="28" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="554" y="180" fill="#dc2626" font-size="11" font-weight="600">Rule 10 enforced</text>

  <!-- Vs comparison strip -->
  <rect x="28" y="326" width="308" height="46" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="44" y="345" fill="#dc2626" font-size="11" font-weight="600">❌ Typical copilot</text>
  <text x="44" y="362" fill="#7f1d1d" font-size="11">Generates plausible-looking IncidentOracle class</text>

  <rect x="348" y="326" width="308" height="46" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="364" y="345" fill="#15803d" font-size="11" font-weight="600">✅ IBM Bob</text>
  <text x="364" y="362" fill="#166534" font-size="11">Honest refusal — no hallucinated API</text>
</svg>
