<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="640" height="340" fill="#f5f5f5" rx="6"/>

  <!-- IDE side panel shadow -->
  <rect x="10" y="10" width="200" height="320" rx="4" fill="#1e1e2e" opacity="0.12"/>
  <rect x="8" y="8" width="200" height="320" rx="4" fill="#1e1e2e"/>

  <!-- Side panel title -->
  <text x="24" y="36" fill="#9ca3af" font-size="11" font-weight="600" letter-spacing="0.08em">IBM BOB</text>
  <circle cx="185" cy="29" r="8" fill="#4ade80" opacity="0.9"/>
  <text x="181" y="33" fill="#14532d" font-size="9" font-weight="700">✓</text>

  <!-- Divider -->
  <line x1="8" y1="48" x2="208" y2="48" stroke="#374151" stroke-width="1"/>

  <!-- Mode selector label -->
  <text x="24" y="72" fill="#9ca3af" font-size="10" letter-spacing="0.06em">MODE</text>

  <!-- Ask mode button (unselected) -->
  <rect x="16" y="80" width="180" height="34" rx="5" fill="#374151"/>
  <text x="36" y="101" fill="#9ca3af" font-size="13">Ask</text>
  <text x="156" y="101" fill="#6b7280" font-size="11">↗</text>

  <!-- Plan mode button (SELECTED) -->
  <rect x="16" y="120" width="180" height="34" rx="5" fill="#3b82f6"/>
  <text x="36" y="141" fill="#ffffff" font-size="13" font-weight="600">Plan</text>
  <text x="144" y="141" fill="#bfdbfe" font-size="10">approval gate</text>

  <!-- Agent mode button (unselected) -->
  <rect x="16" y="160" width="180" height="34" rx="5" fill="#374151"/>
  <text x="36" y="181" fill="#9ca3af" font-size="13">Agent</text>
  <text x="148" y="181" fill="#6b7280" font-size="11">↗</text>

  <!-- Divider -->
  <line x1="16" y1="206" x2="200" y2="206" stroke="#374151" stroke-width="1"/>

  <!-- Context label -->
  <text x="24" y="226" fill="#9ca3af" font-size="10" letter-spacing="0.06em">CONTEXT</text>
  <rect x="16" y="234" width="180" height="24" rx="4" fill="#374151"/>
  <text x="24" y="249" fill="#6b7280" font-size="10">lab/AGENTS.md  ✓ loaded</text>

  <!-- Token counter -->
  <text x="24" y="280" fill="#9ca3af" font-size="10" letter-spacing="0.06em">TOKENS THIS TURN</text>
  <text x="24" y="298" fill="#4ade80" font-size="18" font-weight="700">163</text>
  <text x="72" y="298" fill="#6b7280" font-size="11">/ ~800 baseline</text>

  <!-- Main content panel -->
  <rect x="222" y="8" width="410" height="324" rx="4" fill="#ffffff"/>
  <!-- Panel header -->
  <rect x="222" y="8" width="410" height="40" rx="4" fill="#f8fafc"/>
  <line x1="222" y1="48" x2="632" y2="48" stroke="#e5e7eb" stroke-width="1"/>
  <text x="238" y="32" fill="#374151" font-size="13" font-weight="600">IBM Bob — Plan Mode</text>
  <rect x="558" y="17" width="60" height="22" rx="4" fill="#3b82f6"/>
  <text x="574" y="32" fill="#ffffff" font-size="11" font-weight="600">Approve</text>

  <!-- Bob chat bubble -->
  <rect x="238" y="60" width="360" height="108" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="254" y="82" fill="#1e40af" font-size="11" font-weight="600">IBM Bob</text>
  <text x="254" y="100" fill="#1e3a8a" font-size="11">I've read lab/AGENTS.md. Here is my understanding:</text>
  <text x="254" y="117" fill="#374151" font-size="11">• 7 agents registered across Exercises 1–4</text>
  <text x="254" y="133" fill="#374151" font-size="11">• 10 project rules enforced (outputKey, @Transactional…)</text>
  <text x="254" y="149" fill="#374151" font-size="11">• No Java file scan needed. What do you want to build?</text>

  <!-- Token saved badge -->
  <rect x="238" y="178" width="180" height="28" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="250" y="196" fill="#15803d" font-size="11" font-weight="600">⚡ 637 tokens saved vs scan</text>

  <!-- Approval gate hint callout -->
  <rect x="238" y="218" width="360" height="42" rx="5" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
  <text x="254" y="235" fill="#78350f" font-size="11" font-weight="600">Plan Mode — approval gate active</text>
  <text x="254" y="251" fill="#92400e" font-size="11">Bob will show a diff and wait before writing any file.</text>

  <!-- Callout arrow pointing to Plan button -->
  <line x1="197" y1="137" x2="230" y2="230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="229,222 235,232 223,232" fill="#f59e0b"/>
</svg>
